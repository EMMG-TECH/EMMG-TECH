
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMMG TECH | Zoznam nástrojov</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #ff294f;
            --green: #39ff88;
            --background: #100b18;
            --panel: #111b20;
            --text: #ffffff;
            --muted: #b5c5bd;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(255, 0, 60, 0.30),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(0, 255, 100, 0.24),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #100b18,
                    #071a16,
                    #180b13
                );
        }

        /* Technologická mriežka */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;
        }

        header {
            text-align: center;
            padding: 45px 20px 25px;
        }

        .logo {
            font-size: clamp(38px, 8vw, 70px);
            font-weight: 900;
            letter-spacing: 3px;

            background: linear-gradient(
                100deg,
                var(--red),
                #ff5555,
                var(--green)
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            margin-top: 12px;
            color: var(--muted);
            letter-spacing: 2px;
            font-size: 13px;
            text-transform: uppercase;
        }

        main {
            width: min(900px, 100%);
            margin: 0 auto;
            padding: 25px 22px 60px;
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h2 {
            font-size: clamp(25px, 5vw, 36px);
            margin-bottom: 10px;
        }

        .heading h2 span {
            color: var(--green);
        }

        .heading p {
            color: var(--muted);
            line-height: 1.7;
        }

        /* Zoznam odkazov */
        .tools {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(min(100%, 260px), 1fr)
            );
            gap: 18px;
        }

        .tool-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            min-height: 85px;
            padding: 20px;

            border: 1px solid transparent;
            border-radius: 13px;

            background:
                linear-gradient(
                    rgba(12, 25, 27, 0.96),
                    rgba(12, 25, 27, 0.96)
                ) padding-box,
                linear-gradient(
                    110deg,
                    var(--red),
                    #623044,
                    var(--green)
                ) border-box;

            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;

            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .tool-button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 0 18px rgba(255, 41, 79, 0.18),
                0 0 22px rgba(57, 255, 136, 0.15);
        }

        .tool-button:focus-visible,
        .back-button:focus-visible {
            outline: 3px solid var(--green);
            outline-offset: 4px;
        }

        .tool-name {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .tool-icon {
            font-size: 26px;
        }

        .arrow {
            color: var(--green);
            font-size: 24px;
        }

        .back {
            text-align: center;
            margin-top: 35px;
        }

        .back-button {
            display: inline-block;
            padding: 13px 24px;
            border: 1px solid #52645a;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            background: rgba(12, 25, 27, 0.8);
            transition: border-color 0.2s;
        }

        .back-button:hover {
            border-color: var(--green);
        }

        footer {
            padding: 25px 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.9;
        }

        footer strong {
            color: white;
        }

        footer span {
            color: var(--green);
        }
    </style>
</head>

<body>

    <header>
        <h1 class="logo">EMMG TECH</h1>
        <p>Technology • Innovation • Ideas</p>
    </header>

    <main>
        <section class="heading">
            <h2>Zoznam <span>nástrojov</span></h2>
            <p>
                Vyber si nástroj a otvor ho jediným kliknutím.
            </p>
        </section>

        <section class="tools" aria-label="Dostupné nástroje">

            <!-- NOVÝ NÁSTROJ: skopíruj jeden blok a uprav názov a odkaz. -->

            <a class="tool-button" href="kalkulacka.html">
                <span class="tool-name">
                    <span class="tool-icon">🧮</span>
                    <span>Kalkulačka</span>
                </span>
                <span class="arrow">→</span>
            </a>

            <a class="tool-button" href="prevodnik.html">
                <span class="tool-name">
                    <span class="tool-icon">📏</span>
                    <span>Prevodník jednotiek</span>
                </span>
                <span class="arrow">→</span>
            </a>

            <a class="tool-button" href="generator.html">
                <span class="tool-name">
                    <span class="tool-icon">🎲</span>
                    <span>Generátor</span>
                </span>
                <span class="arrow">→</span>
            </a>

            <a class="tool-button" href="casovac.html">
                <span class="tool-name">
                    <span class="tool-icon">⏱️</span>
                    <span>Časovač a stopky</span>
                </span>
                <span class="arrow">→</span>
            </a>

            <a class="tool-button" href="poznamky.html">
                <span class="tool-name">
                    <span class="tool-icon">📝</span>
                    <span>Poznámky</span>
                </span>
                <span class="arrow">→</span>
            </a>

            <!-- ĎALŠIE NÁSTROJE PRIDÁVAJ NAD TENTO KOMENTÁR. -->

        </section>

        <div class="back">
            <a class="back-button" href="index.html">
                ← Späť na úvodnú stránku
            </a>
        </div>
    </main>

    <footer>
        <strong>EMMG <span>TECH</span></strong><br>
        Technologický projekt vytvorený spoločne<br>
        Erik Mohylák <span>&amp;</span> Marko Grac
    </footer>

</body>
</html>
