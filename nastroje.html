
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMMG TECH | Zoznam nástrojov</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 0, 60, 0.35),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 255, 100, 0.30),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #100b18,
                    #071a16,
                    #180b13
                );
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.035) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;
        }

        header {
            text-align: center;
            padding: 55px 20px 20px;
        }

        .logo {
            font-size: clamp(42px, 9vw, 76px);
            font-weight: 900;
            letter-spacing: 3px;

            background: linear-gradient(
                100deg,
                #ff294f,
                #ff5555,
                #39ff88
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin-top: 15px;
            color: #c5d5cc;
            font-size: 14px;
            letter-spacing: 3px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px 70px;
            text-align: center;
        }

        h2 {
            font-size: clamp(26px, 5vw, 38px);
            margin-bottom: 12px;
        }

        h2 span {
            color: #39ff88;
        }

        .description {
            color: #b5c5bd;
            margin-bottom: 35px;
            line-height: 1.7;
        }

        /* JEDINÉ TLAČIDLO ZOZNAMU */
        .tool-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 18px;

            min-width: min(300px, 100%);
            padding: 22px 30px;

            border: 2px solid transparent;
            border-radius: 14px;

            background:
                linear-gradient(#101b19, #101b19) padding-box,
                linear-gradient(
                    110deg,
                    #ff294f,
                    #ff5555,
                    #39ff88
                ) border-box;

            color: white;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;

            box-shadow:
                0 0 22px rgba(255, 41, 79, 0.15),
                0 0 25px rgba(57, 255, 136, 0.12);

            transition: transform 0.25s, box-shadow 0.25s;
        }

        .tool-button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 0 28px rgba(255, 41, 79, 0.35),
                0 0 35px rgba(57, 255, 136, 0.28);
        }

        .arrow {
            color: #39ff88;
            font-size: 25px;
        }

        .back {
            margin-top: 35px;
        }

        .back a {
            color: #c5d5cc;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back a:hover {
            color: #39ff88;
        }

        footer {
            padding: 24px 15px;
            text-align: center;
            color: #a9bbb3;
            font-size: 13px;
            line-height: 1.9;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        footer strong {
            color: white;
        }

        footer span {
            color: #39ff88;
        }

        @media (max-width: 480px) {
            .subtitle {
                letter-spacing: 1.5px;
            }

            .tool-button {
                width: 100%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1 class="logo">EMMG TECH</h1>
        <p class="subtitle">TECHNOLOGY • INNOVATION • IDEAS</p>
    </header>

    <main>
        <h2>Zoznam <span>nástrojov</span></h2>

        <p class="description">
            Vyber si nástroj a pokračuj ďalej.
        </p>

        <!-- TU SI ZMEŇ NÁZOV A ODKAZ JEDINÉHO TLAČIDLA -->
        <a class="tool-button" href="moj-nastroj.html">
            <span>Môj nástroj</span>
            <span class="arrow">→</span>
        </a>

        <div class="back">
            <a href="index.html">← Späť na úvodnú stránku</a>
        </div>
    </main>

    <footer>
        <strong>EMMG <span>TECH</span></strong><br>
        Technologický projekt vytvorený spoločne<br>
        Erik Mohylák <span>&amp;</span> Marko Grac
    </footer>

</body>
</html>
